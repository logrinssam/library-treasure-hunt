<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#176b4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>부기의 사라진 낱말을 찾아라!</title>
  <meta name="description" content="부산도서관 탐험책 완성 대작전 — 부기의 사라진 낱말을 찾아라!" />
  <!-- 카카오/SNS 링크 미리보기 썸네일: 부기 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="부기의 사라진 낱말을 찾아라!" />
  <meta property="og:description" content="부산도서관 탐험책 완성 대작전" />
  <meta property="og:image" content="https://logrinssam.github.io/library-treasure-hunt/images/og-boogi.png?v=20260804face" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://logrinssam.github.io/library-treasure-hunt/images/og-boogi.png?v=20260804face" />
  <link rel="icon" type="image/png" href="character_image/01_start/01_boogi_reading.png" />
  <link rel="apple-touch-icon" href="images/og-boogi.png?v=20260804face" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260809a" />
</head>
<body>
  <div class="app-shell" id="app">

    <!-- 공통 상단: 행사명 + 음악 토글 -->
    <header class="app-topbar">
      <p class="event-badge">제4회 창의융합 보드게임 대축제</p>
      <button
        id="musicToggle"
        class="music-toggle"
        type="button"
        aria-label="배경음악 켜기"
        aria-pressed="false"
      >
        <span class="music-toggle-icon" aria-hidden="true">♪</span>
        <span class="music-toggle-text">음악 켜기</span>
      </button>
    </header>

    <div class="app-main">

    <!-- 1. 시작 화면 -->
    <section id="startScreen" class="screen start-screen active" aria-labelledby="startTitle">
      <div class="brand-chip" id="startSubtitle">부산도서관 탐험책 완성 대작전</div>

      <h1 id="startTitle" class="start-title">
        부기의 사라진<br />낱말을 찾아라!
      </h1>

      <div class="start-characters" aria-hidden="true">
        <img
          class="start-character boogi-character"
          src="character_image/01_start/01_boogi_reading.png"
          alt=""
        />
        <img
          class="start-character duri-character"
          src="character_image/01_start/02_duri_hi.png"
          alt=""
        />
        <img
          class="start-character seoi-character"
          src="character_image/01_start/03_seoi_hi.png"
          alt=""
        />
      </div>

      <div class="safety-notice" role="note">
        서이와 함께 도서관에서 뛰지 않고 천천히 이동해요!
      </div>

      <button id="startButton" class="primary-button" type="button">
        탐험 시작!
      </button>
      <p class="start-music-hint">♪ 출발하면 음악이 함께 나요</p>

      <button id="startResetButton" class="text-button" type="button">
        처음부터 다시 시작
      </button>
    </section>

    <!-- 2. 공통 문제 화면 -->
    <section id="questionScreen" class="screen question-screen" aria-labelledby="missionQuestion">
      <header class="mission-header">
        <span id="missionLabel" class="mission-label">1 / 4</span>
        <div id="progressDots" class="progress-dots" aria-label="진행 상황"></div>
        <div id="wordTray" class="word-tray" aria-label="찾은 낱말"></div>
      </header>

      <div class="move-guide-row" role="status">
        <img
          id="guideCharacter"
          class="guide-character"
          src="character_image/01_start/02_duri_hi.png"
          alt=""
        />
        <p id="guideBubble" class="guide-bubble">
          1층 꿈뜨락 어린이실로 이동하세요!
        </p>
      </div>

      <article class="question-card">
        <p id="displayQuestion" class="display-question"></p>
        <p id="missionQuestion" class="mission-clue"></p>

        <figure id="missionImageWrap" class="mission-image-wrap">
          <img
            id="missionImage"
            class="mission-image"
            src=""
            alt="이번 장소의 단서 사진"
            decoding="async"
          />
        </figure>

        <!-- 정답 칸: 초성은 칸 위, 글자는 칸 안 -->
        <div id="answerSlots" class="answer-slots" aria-label="정답 칸"></div>

        <!-- 텍스트 힌트 영역 (초성 공개 후 / 2회 오답 후) -->
        <div id="placeHint" class="place-hint" hidden></div>

        <button
          id="hintButton"
          class="hint-button"
          type="button"
          aria-expanded="false"
        >
          초성 힌트 보기
        </button>

        <!-- 10개 글자 조각 (문제마다 섞어서 표시) -->
        <div id="tileBoard" class="tile-board" role="group" aria-label="글자 조각"></div>

        <div class="answer-actions">
          <button
            id="clearTileButton"
            class="secondary-button clear-tile-button"
            type="button"
            disabled
            aria-label="마지막에 고른 글자 지우기"
          >
            한 글자 지우기
          </button>
          <button
            id="checkAnswerButton"
            class="primary-button check-answer-button"
            type="button"
            disabled
          >
            낱말 확인하기
          </button>
        </div>
      </article>

      <button id="questionResetButton" class="text-button reset-button" type="button">
        처음부터 다시 하기
      </button>
    </section>

    <!-- 3. 최종 완료 -->
    <section id="finishScreen" class="screen finish-screen" aria-labelledby="finishTitle">
      <div id="finishBadge" class="finish-badge">미션 4/4 성공</div>

      <h1 id="finishTitle" class="finish-title">부기의 탐험책 완성!</h1>
      <p class="finish-subtitle">네 개의 낱말이 제자리로 돌아왔어요!</p>

      <div class="finish-hero-wrap">
        <div class="finish-hero">
          <!--
            완료 화면은 마지막에야 보인다. src를 비워 두고 script.js에서 붙인다.
            (display:none 안에서는 loading="lazy"가 무시되어 첫 화면에서 같이 받아 버린다)
          -->
          <img
            id="finishHero"
            data-src="character_image/04_finish/finish-celebration.png"
            alt="완성된 탐험책을 들고 함께 축하하는 부기, 두리, 서이"
            decoding="async"
          />
        </div>
      </div>

      <section class="recovered-section" aria-label="되찾은 낱말">
        <h2>되찾은 낱말</h2>
        <!-- 칩은 MISSIONS 데이터로 채웁니다 (script.js: renderFinishScreen) -->
        <div class="word-grid" id="recoveredWords"></div>
      </section>

      <div class="finish-thanks">
        <strong>부기</strong>
        <p>부기의 도서관 탐험책이 다시 완성되었어요!</p>
      </div>

      <button id="surveyButton" class="primary-button survey-button" type="button">
        설문조사하고 경품 교환하기
      </button>

      <footer class="finish-footer">
        <button id="finishResetButton" class="text-button" type="button">
          새로운 참가자 시작
        </button>
      </footer>
    </section>

    <!-- 스크린리더 안내 (화면에는 보이지 않음) -->
    <p id="liveRegion" class="visually-hidden" role="status" aria-live="polite"></p>

    </div><!-- /.app-main -->

    <!-- 공통 하단: 주최 로고 -->
    <footer class="app-footer">
      <div class="footer-logos" aria-label="주최·협력">
        <img
          class="footer-logo footer-logo-busan"
          src="images/logo-busan-library.png"
          alt="부산도서관"
        />
        <img
          class="footer-logo footer-logo-future"
          src="images/logo-future-edu.png"
          alt="전국미래교육연구협회"
        />
        <img
          class="footer-logo footer-logo-gamification"
          src="images/logo-gamification.png"
          alt="부산 게이미피케이션"
        />
      </div>
    </footer>

  </div>

  <!--
    배경음악 (터치/출발 버튼 제스처에서 재생 — QR·모바일 자동재생 정책 대응)

    music-light.mp3: 원본 music.mp3(320kbps 스테레오 3분43초, 8.5MB)를
    64kbps 모노 60초 루프로 다시 인코딩한 것. 폰 스피커로는 차이가 없고 471KB다.
    원본은 저장소에 그대로 남아 있다.

    preload="none": 음악을 켜지 않는 참가자까지 미리 받게 하지 않는다.
    출발 버튼을 누른 사람만 내려받는다.
  -->
  <audio id="bgm" src="music-light.mp3?v=20260809a" loop preload="none" playsinline></audio>

  <!-- 정답·오답 팝업 -->
  <div id="feedbackModal" class="modal-backdrop" hidden>
    <section
      class="feedback-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedbackTitle"
      aria-describedby="feedbackMessage"
    >
      <img id="feedbackImage" class="feedback-character" src="" alt="" />
      <h2 id="feedbackTitle" class="feedback-title"></h2>
      <p id="feedbackMessage" class="feedback-message"></p>
      <button id="feedbackButton" class="primary-button" type="button"></button>
    </section>
  </div>

  <!-- 초기화 확인 -->
  <div id="confirmModal" class="modal-backdrop" hidden>
    <section class="feedback-modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle" class="feedback-title">처음부터 다시 시작할까요?</h2>
      <p class="feedback-message">지금까지의 진행 내용이 사라집니다.</p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="secondary-button" type="button">아니요</button>
        <button id="confirmOk" class="primary-button" type="button">다시 시작하기</button>
      </div>
    </section>
  </div>

  <script src="script.js?v=20260916a"></script>
</body>
</html>
